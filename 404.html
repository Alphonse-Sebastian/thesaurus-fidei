<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thesaurus Fidei — Page not found</title>
  <link rel="icon" href="assets/cross-reworked.svg" type="image/svg+xml">
  <style>
    :root{--bg:#ece2d2;--paper:#fffdf8;--ink:#1c1912;--muted:#675c50;--navy:#0c1020;--gold:#c9a84c}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;background:var(--bg);
      font-family:Georgia,'Times New Roman',serif;color:var(--ink);padding:24px}
    .card{max-width:520px;text-align:center;background:var(--paper);
      border:1px solid rgba(201,168,76,.35);border-radius:14px;padding:44px 34px;
      box-shadow:0 14px 40px rgba(16,20,35,.08)}
    .emblem{width:60px;height:60px;margin:0 auto 20px;display:block}
    h1{font-size:2rem;font-weight:600;letter-spacing:.01em;line-height:1.1}
    .latin{font-style:italic;color:var(--gold);margin-top:6px;font-size:1.05rem}
    p{color:var(--muted);margin-top:16px;line-height:1.6;font-size:1rem}
    a{display:inline-block;margin-top:24px;background:var(--navy);color:#f5ebdc;
      text-decoration:none;padding:11px 22px;border-radius:999px;
      font-family:system-ui,-apple-system,sans-serif;font-size:.78rem;
      font-weight:600;letter-spacing:.14em;text-transform:uppercase}
    a:hover{background:#16203a}
  </style>
</head>
<body>
  <main class="card">
    <img class="emblem" src="assets/cross-reworked.svg" alt="">
    <h1>Thesaurus Fidei</h1>
    <div class="latin">Treasury of the Faith</div>
    <p>That page could not be found. This is a single page site. The four
      pillars, the councils, papal teaching and the Eastern Churches are all
      reached from the front page.</p>
    <a href="./">Return to the front page</a>
  </main>
</body>
</html>
